name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

# The release step below creates/updates a GitHub release with this run's IPA,
# which needs a write token. Nothing else in the workflow writes to the repo.
permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/AirliftFFI/rust-core/target
          key: ${{ runner.os }}-airlift-${{ hashFiles('Vendor/AirliftFFI/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-airlift-

      - name: Check toolchain
        run: bash scripts/check-xcode-toolchain.sh

      - name: Install Rust and the iOS target
        # The direct route and the PosterBoard-only refresh add FFI symbols to
        # the vendored Rust core, so the checked-in archive alone is stale.
        # Build it here, on the same runner that links it, and install it into
        # Vendor/AirliftFFI.xcframework before xcodebuild runs.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rebuild AirliftFFI
        run: bash scripts/build-airlift-ffi-ios.sh --install

      - name: Install XcodeGen
        # Pinned to the version project.yml is written against (2.46 — see the
        # "quirks this file works around" note there), not brew's latest, so the
        # generated project cannot change under a runner image bump.  The release
        # zip is a universal binary *plus* its SettingPresets, and XcodeGen finds
        # those relative to the executable, so the unpacked directory goes on
        # PATH rather than a copied single file.
        env:
          XCODEGEN_VERSION: 2.46.0
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/xcodegen"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # GitHub Releases downloads have returned 504 from the runner
          # (2026-11-09, two attempts), so: retries first, then a mirrored
          # copy of the very same zip, sha256-checked either way.
          if ! curl -fsSL --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"; then
            echo "GitHub download failed — using the mirrored copy"
            curl -fsSL --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://muse.ai/files/1368012179736313/1689682835907867/vqyshyzj09aj4471ec9f6h46/xcodegen-2.46.0.zip"
          fi
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$DEST"
          echo "$DEST/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        # Drift.xcodeproj is a build product of project.yml and is
        # gitignored, so CI regenerates it before xcodebuild can read it.  The
        # manifest's postGenCommand runs scripts/sync-pbxproj-sources.py, which
        # reconciles the Sources phase to what SwiftPM resolves — the same
        # two-step generation a local run does, so the host and CI agree.
        run: |
          xcodegen --version
          xcodegen generate

      # The only supported build path.  It drives Drift.xcodeproj
      # through xcodebuild and packages build/Drift.ipa; the same
      # script is what the local workflow runs, so CI and the host cannot
      # drift apart.
      - name: Build IPA
        shell: bash
        run: |
          set -o pipefail
          # GitHub runs bash with -e; the build is expected to fail on the
          # debugging path, and the reporting below must still run.
          set +e
          zsh ./scripts/build-ipa.sh Release 2>&1 | tee /tmp/build-ipa.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            # Surface the first compiler/linker errors as annotations, which
            # are readable on the public run page without signing in.
            grep -E "error:|fatal error:|Undefined symbols|duplicate symbol|ld: " /tmp/build-ipa.log \
              | head -12 \
              | while IFS= read -r line; do echo "::error::$line"; done
            {
              echo "### Build failed (exit $status)"
              echo '```'
              grep -E "error:|fatal error:|Undefined symbols|ld: |duplicate symbol" /tmp/build-ipa.log | tail -120 || true
              echo '...'
              tail -80 /tmp/build-ipa.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Drift note: the upstream localization-catalog check is not run.
      # Drift is a Chinese-first personal build — its new UI copy is written
      # directly in Chinese — while the inherited catalog still serves the
      # kept upstream views. The check (which also fails on keys orphaned by
      # the removed feature pages) belongs to the upstream project.

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Drift
          path: build/Drift.ipa
          if-no-files-found: error

      # Publish a curated release, but only when the pushed commit says so:
      # an ordinary push still just produces the artifact above. The tag and
      # asset name come from MARKETING_VERSION in project.yml, so a release
      # cannot advertise a version the binary does not carry.
      - name: Publish unsigned IPA to Releases
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' project.yml | tr -d '"' | head -1)"
          if [ -z "$VERSION" ]; then
            echo "error: MARKETING_VERSION not found in project.yml" >&2
            exit 1
          fi
          TAG="v$VERSION"
          ASSET="build/Drift-$VERSION-unsigned.ipa"
          cp build/Drift.ipa "$ASSET"
          NOTES="$(cat <<'EOF'
          **未签名 IPA**，需自签安装（AltStore / SideStore / Sideloadly 等）。

          ## 1.3.0
          - 本机直刷改为运行时 App Group 发现：读取安装包签名实际授予的组名单，用第一个能打开的组，不再写死组名；付费证书、开发者注册的组、SideStore / AltStore 改签都能用，没有可用组时才判不可用。
          - 直刷免注销支持范围扩到 iOS 27.2 测试版 1 / 2（按构建号 24B5084k、24B5089g 判断），测试版 3 起仍关闭；判断层、引擎预检、方式菜单与保存的偏好同步使用构建号。
          - 本机直刷新增生效判定：写完按当时的配对、LocalDevVPN、Wi-Fi 三项决定——齐全就借隧道只重启 PosterBoard、免注销生效（未确认自动再试一次）；不齐全或两次都未确认就只提示「壁纸已写入」并给出手动注销按钮，App 不再自动注销。
          - 检测重构为两类前提、互不绑架：本机直刷只看 App 自身系统版本与可用的 App Group；直刷免注销与 AirLift 必须已配对、隧道连通且真读到设备版本＋构建号。首页不再用配对/隧道拦在所有功能前面，判断卡逐档写明理由与预计生效方式。
          - 手选方式回落统一：任一手选不可用都按本机直刷 → 直刷免注销 → AirLift 的全顺序回落，并写明改判原因。
          - 设置向导先检本机直刷，可用时配对与隧道降为可选、完成按钮不再被它们挡住；设置页新增本机直刷状态与运行时组名，刷入记录显示实际生效方式。
          - 方式定名统一为：自动选择 / 直刷免注销 / 本机直刷 / AirLift 直刷 / 恢复式（暂时关闭）。
          - 隧道写入的商店结构版本收敛为集中校验：按设备版本与构建号核对已验证范围，对不上就报错并写日志，不再散落写死常量。
          - 恢复式仍暂时停用。视频壁纸、重置商店、带数据库的容器包仍只能走恢复式。
          - 完整说明与风险见仓库 README。

          由 GitHub Actions 的 macOS 运行器从 __COMMIT__ 构建。
          EOF
          )"
          NOTES="${NOTES//__COMMIT__/${GITHUB_SHA:0:12}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Drift $VERSION" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$ASSET" \
              --title "Drift $VERSION" \
              --notes "$NOTES" \
              --latest
          fi

# Manual rebuild trigger
