name: Build IPA

on:
  # Publishing (Grace, 2026-11-19): pushing a bare version tag
  # (e.g. 3.3.7) builds that version and swaps it into the single
  # rolling Nightly pre-release under the fixed `nightly` tag (the old
  # pre-lockout scheme); the one-shot version tag is removed again
  # afterwards. Ordinary branch pushes never trigger this workflow.
  # A manual dispatch only builds the IPA artifact - it never publishes.
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: drift-nightly-release
  cancel-in-progress: false

# The release step below creates/updates a GitHub release with this run's IPA,
# which needs a write token. Nothing else in the workflow writes to the repo.
permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and build from the tag or project.yml
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' project.yml | tr -d '"' | head -1)"
          BUILD="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*//p' project.yml | tr -d '"' | head -1)"
          if [ -z "$PROJECT_VERSION" ] || [ -z "$BUILD" ]; then
            echo "::error::MARKETING_VERSION or CURRENT_PROJECT_VERSION missing from project.yml"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
            if [ "$VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::Tag $VERSION does not match project.yml version $PROJECT_VERSION; set project.yml to the tagged version first."
              exit 1
            fi
          else
            VERSION="$PROJECT_VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $VERSION (expected x.y.z)"
            exit 1
          fi
          # Build number rule (Grace, 2026-11-19): a brand-new version
          # starts at build 1; only re-publishing the SAME version
          # increments the build. The current Nightly's stamp records
          # which version and build it holds.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PREV_BUILD=0
            NIGHTLY_JSON="$(mktemp)"
            NIGHTLY_STATUS="$(curl -sS -o "$NIGHTLY_JSON" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/nightly" || true)"
            if [ "$NIGHTLY_STATUS" = "200" ]; then
              PREV_BUILD="$(python3 - "$NIGHTLY_JSON" "$VERSION" <<'PYEOF'
          import json, re, sys
          body = json.load(open(sys.argv[1])).get("body") or ""
          m = re.search(r"drift-nightly:\s*([0-9]+\.[0-9]+\.[0-9]+)\s+([0-9]+)", body)
          print(m.group(2) if m and m.group(1) == sys.argv[2] else "0")
          PYEOF
          )"
            fi
            rm -f "$NIGHTLY_JSON"
            case "$PREV_BUILD" in ''|*[!0-9]*) PREV_BUILD=0 ;; esac
            BUILD=$((PREV_BUILD + 1))
            sed -i '' "s/^\([[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*\).*/\1\"$BUILD\"/" project.yml
            echo "Build rule: previous same-version build $PREV_BUILD -> this build $BUILD"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nightly version $VERSION (build $BUILD), tag $VERSION"

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/AirliftFFI/rust-core/target
          key: ${{ runner.os }}-airlift-${{ hashFiles('Vendor/AirliftFFI/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-airlift-

      - name: Check toolchain
        run: bash scripts/check-xcode-toolchain.sh

      - name: Install Rust and the iOS target
        # The direct route and the PosterBoard-only refresh add FFI symbols to
        # the vendored Rust core, so the checked-in archive alone is stale.
        # Build it here, on the same runner that links it, and install it into
        # Vendor/AirliftFFI.xcframework before xcodebuild runs.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rebuild AirliftFFI
        run: bash scripts/build-airlift-ffi-ios.sh --install

      - name: Install XcodeGen
        # Pinned to the version project.yml is written against (2.46 — see the
        # "quirks this file works around" note there), not brew's latest, so the
        # generated project cannot change under a runner image bump.  The release
        # zip is a universal binary *plus* its SettingPresets, and XcodeGen finds
        # those relative to the executable, so the unpacked directory goes on
        # PATH rather than a copied single file.
        env:
          XCODEGEN_VERSION: 2.46.0
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/xcodegen"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # GitHub Releases downloads have returned 504 from the runner
          # (2026-11-09, two attempts), so: retries first, then a mirrored
          # copy of the very same zip, sha256-checked either way.
          if ! curl -fsSL --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"; then
            echo "GitHub download failed — using the mirrored copy"
            curl -fsSL --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://muse.ai/files/1368012179736313/1689682835907867/vqyshyzj09aj4471ec9f6h46/xcodegen-2.46.0.zip"
          fi
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$DEST"
          echo "$DEST/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        # Drift.xcodeproj is a build product of project.yml and is
        # gitignored, so CI regenerates it before xcodebuild can read it.  The
        # manifest's postGenCommand runs scripts/sync-pbxproj-sources.py, which
        # reconciles the Sources phase to what SwiftPM resolves — the same
        # two-step generation a local run does, so the host and CI agree.
        run: |
          xcodegen --version
          xcodegen generate

      # The only supported build path.  It drives Drift.xcodeproj
      # through xcodebuild and packages build/Drift.ipa; the same
      # script is what the local workflow runs, so CI and the host cannot
      # drift apart.
      - name: Build IPA
        shell: bash
        env:
          PROBE_BUILD: '0'
          DRIFT_CHANNEL: nightly
        run: |
          set -o pipefail
          # GitHub runs bash with -e; the build is expected to fail on the
          # debugging path, and the reporting below must still run.
          set +e
          zsh ./scripts/build-ipa.sh Release 2>&1 | tee /tmp/build-ipa.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            # Surface the first compiler/linker errors as annotations, which
            # are readable on the public run page without signing in.
            grep -E "error:|fatal error:|Undefined symbols|duplicate symbol|ld: " /tmp/build-ipa.log \
              | head -12 \
              | while IFS= read -r line; do echo "::error::$line"; done
            {
              echo "### Build failed (exit $status)"
              echo '```'
              grep -E "error:|fatal error:|Undefined symbols|ld: |duplicate symbol" /tmp/build-ipa.log | tail -120 || true
              echo '...'
              tail -80 /tmp/build-ipa.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Drift note: the upstream localization-catalog check is not run.
      # Drift is a Chinese-first personal build — its new UI copy is written
      # directly in Chinese — while the inherited catalog still serves the
      # kept upstream views. The check (which also fails on keys orphaned by
      # the removed feature pages) belongs to the upstream project.

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Drift
          path: build/Drift.ipa
          if-no-files-found: error

      # Publishing happens only on a version-tag push: the tag IS the
      # release decision. Version and build come from project.yml at the
      # tagged commit (validated above to match the tag), the release
      # notes come from the annotated tag's message when one is present,
      # and the build replaces the single rolling Nightly pre-release
      # under the fixed `nightly` tag (deleted and recreated, tag moved
      # onto the tagged commit). The hidden drift-nightly stamp stays
      # in the body: the in-app nightly update check parses version and
      # build from it.
      - name: Publish the Nightly pre-release (fixed nightly tag)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TAG: nightly
        run: |
          set -euo pipefail
          # The published asset carries the version (Grace, 2026-11-20:
          # nightly and alpha assets are Drift-<version>-unsigned.ipa
          # from the next version on; the fixed nightly tag and the
          # "Nightly" title do not change). The app's update check finds
          # it through its any-.ipa fallback.
          ASSET="build/Drift-${VERSION}-unsigned.ipa"
          cp build/Drift.ipa "$ASSET"

          NOTES="$(git tag -l "$TAG" --format='%(contents)' | sed -e 's/[[:space:]]*$//' || true)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Drift $VERSION Nightly pre-release, build $BUILD_NUMBER. Published automatically from the version tag."
          fi

          RELEASE_JSON="$(mktemp)"
          RELEASE_STATUS="$(curl -sS -o "$RELEASE_JSON" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [ "$RELEASE_STATUS" = "200" ]; then
            IS_PRERELEASE="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("prerelease", False)).lower())' "$RELEASE_JSON")"
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is a formal release, not a pre-release; refusing to replace it."
              exit 1
            fi
            RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RELEASE_JSON")"
            DELETE_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            if [ "$DELETE_STATUS" != "204" ]; then
              echo "::error::Could not delete existing pre-release $RELEASE_TAG (HTTP $DELETE_STATUS)"
              exit 1
            fi
            echo "Deleted existing pre-release $RELEASE_TAG."
          elif [ "$RELEASE_STATUS" != "404" ]; then
            echo "::error::Could not inspect Release $RELEASE_TAG (HTTP $RELEASE_STATUS)"
            cat "$RELEASE_JSON"
            exit 1
          fi
          rm -f "$RELEASE_JSON"

          # Move the rolling nightly tag onto this commit: drop the old
          # ref here; the create call below recreates it at TARGET_COMMIT.
          curl -sS -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true

          TARGET_COMMIT="$(git rev-parse HEAD)"
          export TARGET_COMMIT NOTES
          BODY="$(python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          build = os.environ["BUILD_NUMBER"]
          notes = os.environ["NOTES"].rstrip()
          notes += chr(10) + chr(10) + "<!-- drift-nightly: " + version + " " + build + " -->"
          print(json.dumps({
              "tag_name": os.environ["RELEASE_TAG"],
              "target_commitish": os.environ["TARGET_COMMIT"],
              "name": "Nightly",
              "body": notes,
              "prerelease": True
          }, ensure_ascii=False))
          PY
          )"
          RESPONSE="$(mktemp)"
          CREATE_STATUS="$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            --data-binary "$BODY")"
          if [ "$CREATE_STATUS" != "201" ]; then
            echo "::error::Could not create Nightly $RELEASE_TAG (HTTP $CREATE_STATUS)"
            head -c 2000 "$RESPONSE"
            exit 1
          fi
          rm -f "$RESPONSE"
          gh release upload "$RELEASE_TAG" "$ASSET"
          echo "Nightly $VERSION (build $BUILD_NUMBER) published under the fixed nightly tag."

      # The version tag was a one-shot trigger: remove it so the repo
      # keeps only the fixed nightly tag and the formal version tags.
      - name: Remove the one-shot version trigger tag
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl -sS -o /dev/null -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
          echo "Trigger tag $TAG removed; the Nightly lives under the fixed nightly tag."

      # Keep project.yml in step with the shipped build number.
      - name: Write the shipped build number back to project.yml
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- project.yml; then
            echo "project.yml already matches the shipped build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          git commit -m "版本号回写 ${{ steps.version.outputs.version }} 构建 ${{ steps.version.outputs.build }}"
          git push origin HEAD:refs/heads/prerelease || echo "::warning::project.yml write-back push failed; the release itself is already published."
