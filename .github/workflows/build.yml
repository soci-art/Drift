name: Build IPA

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: "版本操作：升版本时必须高于当前版本；替换版本允许使用相同版本号"
        type: choice
        options:
          - increase
          - replace
        required: true
        default: replace
      version:
        description: "目标版本号，例如 1.0.0（Tag 也使用这个名称，不加 v）"
        type: string
        required: true
      build_number:
        description: "App 构建号（CURRENT_PROJECT_VERSION）"
        type: string
        required: true
      release_notes:
        description: "本次 Nightly 预发行说明"
        type: string
        required: true
      delete_existing:
        description: "若版本对应的 Release 或 Tag 已存在，先自动删除再创建"
        type: boolean
        required: true
        default: true
      probe_build:
        description: "是否包含临时探针功能"
        type: boolean
        required: true
        default: false

concurrency:
  group: drift-nightly-release
  cancel-in-progress: false

# The release step below creates/updates a GitHub release with this run's IPA,
# which needs a write token. Nothing else in the workflow writes to the repo.
permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate and set the manually supplied version
        shell: bash
        env:
          VERSION_MODE: ${{ inputs.version_mode }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Nightly release workflow must be run from the main branch."
            exit 1
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path("project.yml")
          text = path.read_text()
          mode = os.environ["VERSION_MODE"]
          version = os.environ["VERSION"].strip()
          build = os.environ["BUILD_NUMBER"].strip()
          match = re.search(r'(?m)^\s*MARKETING_VERSION:\s*"?([0-9]+(?:\.[0-9]+){2})', text)
          if not match:
              raise SystemExit("MARKETING_VERSION not found in project.yml")
          current = match.group(1)
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){2}", version):
              raise SystemExit("版本号格式错误，请填写 x.y.z，例如 1.0.0")
          if not build.isdigit() or int(build) < 1:
              raise SystemExit("构建号必须是大于 0 的整数")
          if mode == "increase" and tuple(map(int, version.split("."))) <= tuple(map(int, current.split("."))):
              raise SystemExit(f"升版本模式要求目标版本高于当前版本 {current}；如需同版本替换，请选择 replace")
          if mode not in ("increase", "replace"):
              raise SystemExit("未知的版本操作方式")
          text, count = re.subn(r'(?m)^(\s*MARKETING_VERSION:\s*).+$',
                                lambda m: m.group(1) + '"' + version + '"', text, count=1)
          if count != 1:
              raise SystemExit("无法更新 MARKETING_VERSION")
          text, count = re.subn(r'(?m)^(\s*CURRENT_PROJECT_VERSION:\s*).+$',
                                lambda m: m.group(1) + '"' + build + '"', text, count=1)
          if count != 1:
              raise SystemExit("无法更新 CURRENT_PROJECT_VERSION")
          path.write_text(text)
          print(f"version mode={mode}; {current} -> {version}; build={build}")
          PY

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/AirliftFFI/rust-core/target
          key: ${{ runner.os }}-airlift-${{ hashFiles('Vendor/AirliftFFI/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-airlift-

      - name: Check toolchain
        run: bash scripts/check-xcode-toolchain.sh

      - name: Install Rust and the iOS target
        # The direct route and the PosterBoard-only refresh add FFI symbols to
        # the vendored Rust core, so the checked-in archive alone is stale.
        # Build it here, on the same runner that links it, and install it into
        # Vendor/AirliftFFI.xcframework before xcodebuild runs.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rebuild AirliftFFI
        run: bash scripts/build-airlift-ffi-ios.sh --install

      - name: Install XcodeGen
        # Pinned to the version project.yml is written against (2.46 — see the
        # "quirks this file works around" note there), not brew's latest, so the
        # generated project cannot change under a runner image bump.  The release
        # zip is a universal binary *plus* its SettingPresets, and XcodeGen finds
        # those relative to the executable, so the unpacked directory goes on
        # PATH rather than a copied single file.
        env:
          XCODEGEN_VERSION: 2.46.0
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/xcodegen"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # GitHub Releases downloads have returned 504 from the runner
          # (2026-11-09, two attempts), so: retries first, then a mirrored
          # copy of the very same zip, sha256-checked either way.
          if ! curl -fsSL --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"; then
            echo "GitHub download failed — using the mirrored copy"
            curl -fsSL --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://muse.ai/files/1368012179736313/1689682835907867/vqyshyzj09aj4471ec9f6h46/xcodegen-2.46.0.zip"
          fi
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$DEST"
          echo "$DEST/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        # Drift.xcodeproj is a build product of project.yml and is
        # gitignored, so CI regenerates it before xcodebuild can read it.  The
        # manifest's postGenCommand runs scripts/sync-pbxproj-sources.py, which
        # reconciles the Sources phase to what SwiftPM resolves — the same
        # two-step generation a local run does, so the host and CI agree.
        run: |
          xcodegen --version
          xcodegen generate

      # The only supported build path.  It drives Drift.xcodeproj
      # through xcodebuild and packages build/Drift.ipa; the same
      # script is what the local workflow runs, so CI and the host cannot
      # drift apart.
      - name: Build IPA
        shell: bash
        env:
          PROBE_BUILD: ${{ inputs.probe_build && '1' || '0' }}
          DRIFT_CHANNEL: nightly
        run: |
          set -o pipefail
          # GitHub runs bash with -e; the build is expected to fail on the
          # debugging path, and the reporting below must still run.
          set +e
          zsh ./scripts/build-ipa.sh Release 2>&1 | tee /tmp/build-ipa.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            # Surface the first compiler/linker errors as annotations, which
            # are readable on the public run page without signing in.
            grep -E "error:|fatal error:|Undefined symbols|duplicate symbol|ld: " /tmp/build-ipa.log \
              | head -12 \
              | while IFS= read -r line; do echo "::error::$line"; done
            {
              echo "### Build failed (exit $status)"
              echo '```'
              grep -E "error:|fatal error:|Undefined symbols|ld: |duplicate symbol" /tmp/build-ipa.log | tail -120 || true
              echo '...'
              tail -80 /tmp/build-ipa.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Drift note: the upstream localization-catalog check is not run.
      # Drift is a Chinese-first personal build — its new UI copy is written
      # directly in Chinese — while the inherited catalog still serves the
      # kept upstream views. The check (which also fails on keys orphaned by
      # the removed feature pages) belongs to the upstream project.

      - name: Persist the selected app version and build number
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if git diff --cached --quiet; then
            echo "project.yml already has the selected version and build number."
          else
            git commit -m "chore: set Nightly version $VERSION [manual-version]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Drift
          path: build/Drift.ipa
          if-no-files-found: error

      # A manual run owns the entire pre-release lifecycle. If the selected
      # version already has a Release or a bare Git tag, replace both first.
      - name: Replace the Nightly pre-release and version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          DELETE_EXISTING: ${{ inputs.delete_existing }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$VERSION" | xargs)"
          BUILD_NUMBER="$(printf '%s' "$BUILD_NUMBER" | xargs)"
          TAG="$VERSION"
          ASSET="build/Drift-unsigned.ipa"
          cp build/Drift.ipa "$ASSET"

          RELEASE_JSON="$(mktemp)"
          RELEASE_STATUS="$(curl -sS -o "$RELEASE_JSON" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          if [ "$RELEASE_STATUS" = "200" ]; then
            if [ "$DELETE_EXISTING" != "true" ]; then
              echo "::error::Release $TAG already exists; enable automatic deletion or choose another version."
              exit 1
            fi
            RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RELEASE_JSON")"
            DELETE_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            if [ "$DELETE_STATUS" != "204" ]; then
              echo "::error::Could not delete existing Release $TAG (HTTP $DELETE_STATUS)"
              exit 1
            fi
            echo "Deleted existing Release $TAG."
          elif [ "$RELEASE_STATUS" != "404" ]; then
            echo "::error::Could not inspect Release $TAG (HTTP $RELEASE_STATUS)"
            cat "$RELEASE_JSON"
            exit 1
          fi
          rm -f "$RELEASE_JSON"

          TAG_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          if [ "$TAG_STATUS" = "200" ]; then
            if [ "$DELETE_EXISTING" != "true" ]; then
              echo "::error::Tag $TAG already exists; enable automatic deletion or choose another version."
              exit 1
            fi
            DELETE_TAG_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG")"
            if [ "$DELETE_TAG_STATUS" != "204" ]; then
              echo "::error::Could not delete existing tag $TAG (HTTP $DELETE_TAG_STATUS)"
              exit 1
            fi
            echo "Deleted existing tag $TAG."
          elif [ "$TAG_STATUS" != "404" ]; then
            echo "::error::Could not inspect tag $TAG (HTTP $TAG_STATUS)"
            exit 1
          fi

          TARGET_COMMIT="$(git rev-parse HEAD)"
          export TARGET_COMMIT
          BODY="$(python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          build = os.environ["BUILD_NUMBER"]
          notes = os.environ["RELEASE_NOTES"].rstrip()
          notes += f"\n\n<!-- drift-nightly: {version} {build} -->"
          print(json.dumps({
              "tag_name": version,
              "target_commitish": os.environ["TARGET_COMMIT"],
              "name": f"Nightly {version}",
              "body": notes,
              "prerelease": True
          }, ensure_ascii=False))
          PY
          )"
          RESPONSE="$(mktemp)"
          CREATE_STATUS="$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            --data-binary "$BODY")"
          if [ "$CREATE_STATUS" != "201" ]; then
            echo "::error::Could not create Nightly $TAG (HTTP $CREATE_STATUS)"
            head -c 2000 "$RESPONSE"
            exit 1
          fi
          rm -f "$RESPONSE"
          gh release upload "$TAG" "$ASSET"
          echo "Nightly $VERSION (build $BUILD_NUMBER) published; release and tag replacement completed."
