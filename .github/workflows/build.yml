name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

# The release step below creates/updates a GitHub release with this run's IPA,
# which needs a write token. Nothing else in the workflow writes to the repo.
permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Vendor/AirliftFFI/rust-core/target
          key: ${{ runner.os }}-airlift-${{ hashFiles('Vendor/AirliftFFI/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-airlift-

      - name: Check toolchain
        run: bash scripts/check-xcode-toolchain.sh

      - name: Install Rust and the iOS target
        # The direct route and the PosterBoard-only refresh add FFI symbols to
        # the vendored Rust core, so the checked-in archive alone is stale.
        # Build it here, on the same runner that links it, and install it into
        # Vendor/AirliftFFI.xcframework before xcodebuild runs.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          . "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rebuild AirliftFFI
        run: bash scripts/build-airlift-ffi-ios.sh --install

      - name: Install XcodeGen
        # Pinned to the version project.yml is written against (2.46 — see the
        # "quirks this file works around" note there), not brew's latest, so the
        # generated project cannot change under a runner image bump.  The release
        # zip is a universal binary *plus* its SettingPresets, and XcodeGen finds
        # those relative to the executable, so the unpacked directory goes on
        # PATH rather than a copied single file.
        env:
          XCODEGEN_VERSION: 2.46.0
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/xcodegen"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          # GitHub Releases downloads have returned 504 from the runner
          # (2026-11-09, two attempts), so: retries first, then a mirrored
          # copy of the very same zip, sha256-checked either way.
          if ! curl -fsSL --max-time 90 --retry 2 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"; then
            echo "GitHub download failed — using the mirrored copy"
            curl -fsSL --max-time 120 -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://muse.ai/files/1368012179736313/1689682835907867/vqyshyzj09aj4471ec9f6h46/xcodegen-2.46.0.zip"
          fi
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$DEST"
          echo "$DEST/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        # Drift.xcodeproj is a build product of project.yml and is
        # gitignored, so CI regenerates it before xcodebuild can read it.  The
        # manifest's postGenCommand runs scripts/sync-pbxproj-sources.py, which
        # reconciles the Sources phase to what SwiftPM resolves — the same
        # two-step generation a local run does, so the host and CI agree.
        run: |
          xcodegen --version
          xcodegen generate

      # The only supported build path.  It drives Drift.xcodeproj
      # through xcodebuild and packages build/Drift.ipa; the same
      # script is what the local workflow runs, so CI and the host cannot
      # drift apart.
      - name: Build IPA
        shell: bash
        env:
          # A [probe] commit compiles the temporary enumeration button in.
          # Ordinary pushes leave the flag empty, so the button is absent.
          PROBE_BUILD: ${{ contains(github.event.head_commit.message, '[probe]') && '1' || '0' }}
        run: |
          set -o pipefail
          # GitHub runs bash with -e; the build is expected to fail on the
          # debugging path, and the reporting below must still run.
          set +e
          zsh ./scripts/build-ipa.sh Release 2>&1 | tee /tmp/build-ipa.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            # Surface the first compiler/linker errors as annotations, which
            # are readable on the public run page without signing in.
            grep -E "error:|fatal error:|Undefined symbols|duplicate symbol|ld: " /tmp/build-ipa.log \
              | head -12 \
              | while IFS= read -r line; do echo "::error::$line"; done
            {
              echo "### Build failed (exit $status)"
              echo '```'
              grep -E "error:|fatal error:|Undefined symbols|ld: |duplicate symbol" /tmp/build-ipa.log | tail -120 || true
              echo '...'
              tail -80 /tmp/build-ipa.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      # Drift note: the upstream localization-catalog check is not run.
      # Drift is a Chinese-first personal build — its new UI copy is written
      # directly in Chinese — while the inherited catalog still serves the
      # kept upstream views. The check (which also fails on keys orphaned by
      # the removed feature pages) belongs to the upstream project.

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Drift
          path: build/Drift.ipa
          if-no-files-found: error

      # Replace the IPA attachment on the rolling `nightly` pre-release
      # (Grace, 2026-11-14, SideStore's shape): pre-releases carry no
      # version — one fixed tag `nightly`, title "Nightly", asset
      # `Drift-unsigned.ipa` — so test builds never consume a formal
      # version number. A formal release is never touched: if `nightly`
      # exists and is not a pre-release the step fails rather than
      # swapping a shipped IPA. The release is created as an empty
      # pre-release only when it does not exist at all; its title, notes
      # and non-IPA assets are never edited afterwards. [probe] builds
      # the probe package; [preview] builds the formal handover package
      # without the probe switch.
      - name: Replace the nightly pre-release IPA with this build
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (contains(github.event.head_commit.message, '[probe]') ||
           contains(github.event.head_commit.message, '[preview]'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' project.yml | tr -d '\"' | head -1)"
          BUILD="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*//p' project.yml | tr -d '\"' | head -1)"
          if [ -z "$VERSION" ] || [ -z "$BUILD" ]; then
            echo "error: VERSION or BUILD missing from project.yml" >&2
            exit 1
          fi
          TAG="nightly"
          ASSET="build/Drift-unsigned.ipa"
          cp build/Drift.ipa "$ASSET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release $TAG yet — creating it as an empty pre-release"
            # Created with curl rather than gh: both `gh release create`
            # and `gh api` failed here with an EMPTY message, so this form
            # records the HTTP status and response body, which can be put
            # on the public run page when it fails.
            RESP="$(mktemp)"
            ERR="$(mktemp)"
            BODY="$(printf '{"tag_name":"%s","target_commitish":"%s","name":"Nightly","body":"预发行构建（滚动更新），供测试使用。未签名 IPA，安装者自行签名；不影响正式版。","prerelease":true}' \
              "$TAG" "$GITHUB_SHA")"
            CODE="$(curl -sS -o "$RESP" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
              --data-binary "$BODY" 2>"$ERR")" || CODE="${CODE:-000}"
            if [ "$CODE" != "201" ]; then
              # The run page's log needs a sign-in; an annotation is the
              # only part of a failure a public reader can see, so the
              # reason goes there as well as into the log.
              echo "::error::release create $TAG failed: HTTP ${CODE}; $(head -c 400 "$RESP" | tr '\n' ' '); $(head -c 300 "$ERR" | tr '\n' ' ')"
              head -c 2000 "$RESP" >&2; echo >&2; cat "$ERR" >&2
              exit 1
            fi
            rm -f "$RESP" "$ERR"
          fi
          if [ "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            echo "error: $TAG is not a pre-release; refusing to replace its IPA" >&2
            exit 1
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            while IFS= read -r old; do
              case "$old" in
                *.ipa) gh release delete-asset "$TAG" "$old" -y ;;
              esac
            done
          gh release upload "$TAG" "$ASSET"

      # Publish a curated release, but only when the pushed commit says so:
      # an ordinary push still just produces the artifact above. The tag and
      # asset name come from MARKETING_VERSION in project.yml, so a release
      # cannot advertise a version the binary does not carry. The asset
      # name is the version alone, no build number (Grace's rule of
      # 2026-11-13, first applied to 3.2.2): the in-app update checker
      # tolerates a build-less name and falls back to comparing versions;
      # the accepted cost is that an in-place asset swap under the same
      # version no longer prompts an in-app update.
      - name: Publish unsigned IPA to Releases
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*//p' project.yml | tr -d '"' | head -1)"
          if [ -z "$VERSION" ]; then
            echo "error: MARKETING_VERSION not found in project.yml" >&2
            exit 1
          fi
          BUILD="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*//p' project.yml | tr -d '"' | head -1)"
          if [ -z "$BUILD" ]; then
            echo "error: CURRENT_PROJECT_VERSION not found in project.yml" >&2
            exit 1
          fi
          TAG="v$VERSION"
          ASSET="build/Drift-$VERSION-unsigned.ipa"
          cp build/Drift.ipa "$ASSET"
          NOTES="$(cat "RELEASE-NOTES-$VERSION.md")"
          NOTES="${NOTES//__COMMIT__/${GITHUB_SHA:0:12}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Drift $VERSION" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$ASSET" \
              --title "Drift $VERSION" \
              --notes "$NOTES" \
              --latest
          fi

# Manual rebuild trigger
