name: Vendor import (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download and extract binary files
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/drift-binaries.tar.gz "https://muse.ai/files/1368012179736313/1151880664490520/6l8wau1z8tekcw2hzpe3dd3k/drift-binaries.tar.gz"
          echo "1e2dff7c79a54bbc0e0619c4e7049e7af3f118083b103a5b5e07e3832a9fb544  /tmp/drift-binaries.tar.gz" | sha256sum -c -
          tar -xzf /tmp/drift-binaries.tar.gz
      - name: Commit binaries and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "drift-import"
          git config user.email "drift-import@localhost"
          git add -A
          git rm -q --cached .github/workflows/vendor-import.yml || true
          rm -f .github/workflows/vendor-import.yml
          git add -A
          git status --short | head -60
          git commit -m "导入二进制文件（Vendor 静态库/图标等），并移除一次性导入工作流"
          git push
